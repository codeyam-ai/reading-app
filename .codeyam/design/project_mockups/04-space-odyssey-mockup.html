<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Tomo · Night Reading direction</title>
<style>
:root{--orange:#ff5a1f;--orange-soft:#ff8a5a;--magenta:#c72f8f;--purple:#5a2890;--purple-deep:#2a1450;--bg:#07060a;--panel:#11101a;--cream:#f4ecdf;--ink:#f5f0e6;--dim:#b9b0a4;--mute:#6e6878;--green:#4ade80;
--display:'Bricolage Grotesque','Avenir Next',-apple-system,system-ui,sans-serif;--mono:'JetBrains Mono',ui-monospace,Menlo,monospace}
*{box-sizing:border-box;margin:0;padding:0}
body{background:#1a1420;font-family:var(--display);color:var(--ink);display:flex;justify-content:center;padding:32px 16px}
.phone{width:390px;height:844px;border-radius:46px;border:10px solid #000;overflow:hidden;position:relative;
background:radial-gradient(120% 60% at 50% 28%,rgba(255,90,31,.42) 0%,rgba(199,47,143,.22) 30%,rgba(42,20,80,.5) 55%,var(--bg) 80%)}
.screen{padding:0 22px;position:relative}
.status{display:flex;justify-content:space-between;font:600 14px var(--display);padding:14px 6px 6px}
.lbl{font:500 10px var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--dim)}
.top{display:flex;justify-content:space-between;align-items:center;padding:10px 0}
.brand{display:flex;align-items:center;gap:8px;font-weight:600;font-size:17px;letter-spacing:-.02em}
.brand i{width:8px;height:8px;border-radius:50%;background:var(--orange);box-shadow:0 0 12px var(--orange)}
.pillo{border:1px solid rgba(245,240,230,.2);border-radius:999px;padding:6px 12px;font:500 11px var(--mono);color:var(--ink)}
.stage{position:relative;height:330px;display:grid;place-items:center;margin-top:6px}
.ring{position:absolute;inset:0;margin:auto;width:300px;height:300px}
.cover{width:156px;height:234px;border-radius:6px;box-shadow:0 30px 60px rgba(0,0,0,.6),0 0 80px rgba(255,90,31,.35);position:relative}
.pct{position:absolute;top:0;right:0;text-align:right}
.pct b{display:block;font:600 28px var(--display);letter-spacing:-.04em}
h1{font-weight:600;font-size:30px;line-height:1.05;letter-spacing:-.035em;text-align:center;margin:4px 0 6px}
.au{text-align:center;color:var(--dim);font-size:15px}
.goal{margin:18px 0 0;background:rgba(17,16,26,.75);border:1px solid rgba(245,240,230,.08);border-radius:24px;padding:16px;display:flex;align-items:center;gap:14px;backdrop-filter:blur(8px)}
.goal p{font-size:15px;line-height:1.3;flex:1}
.goal p em{font-style:normal;color:var(--orange-soft)}
.play{width:52px;height:52px;border-radius:50%;background:var(--orange);display:grid;place-items:center;box-shadow:0 0 30px rgba(255,90,31,.6);flex:none}
.queue{display:flex;gap:10px;margin-top:18px;align-items:flex-end}
.q{flex:1}
.q .c{aspect-ratio:2/3;border-radius:4px;opacity:.9}
.q p{font:500 9.5px var(--mono);color:var(--dim);margin-top:6px;letter-spacing:.06em;text-transform:uppercase}
.q p.ok{color:var(--green)}
.tabs{position:absolute;bottom:0;left:0;right:0;height:80px;background:linear-gradient(transparent,var(--bg) 40%);display:flex;justify-content:space-around;align-items:center;padding-top:10px}
.tabs span{font:500 10px var(--mono);letter-spacing:.12em;color:var(--mute);text-transform:uppercase}
.tabs .on{color:var(--ink)}
.tabs .on:before{content:'';display:block;width:4px;height:4px;border-radius:50%;background:var(--orange);margin:0 auto 6px}
