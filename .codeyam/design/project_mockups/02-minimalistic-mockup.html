*{box-sizing:border-box;margin:0;padding:0}
body{background:#e4e3dd;font-family:var(--sans);color:var(--ink);display:flex;justify-content:center;padding:32px 16px}
.phone{width:390px;height:844px;background:var(--bg);border-radius:46px;border:10px solid #1b1b1a;overflow:hidden;position:relative}
.screen{padding:0 32px}
.status{display:flex;justify-content:space-between;font:600 14px var(--sans);padding:14px 0 0}
.top{display:flex;justify-content:space-between;align-items:baseline;padding:30px 0 0}
.mark{font:600 17px var(--sans);letter-spacing:-.02em}
.mark span{color:var(--accent)}
.mono{font:400 11px var(--mono);color:var(--faint)}
.focus{margin-top:84px}
.cover{width:72px;height:108px;border-radius:2px;box-shadow:0 1px 0 var(--line)}
.focus h1{font:500 30px/1.12 var(--sans);letter-spacing:-.035em;margin-top:28px}
.focus .by{font:400 15px var(--sans);color:var(--muted);margin-top:8px}
.line{position:relative;height:1px;background:var(--line);margin-top:40px}
.line i{position:absolute;left:0;top:0;height:1px;width:51%;background:var(--ink)}
.line b{position:absolute;left:51%;top:-3px;width:7px;height:7px;border-radius:50%;background:var(--accent);margin-left:-3px}
.pages{display:flex;justify-content:space-between;margin-top:12px}
.also{margin-top:56px;font:400 14px/1.9 var(--sans);color:var(--muted)}
.also b{font-weight:500;color:var(--ink)}
.also em{font-style:normal;color:var(--accent)}
.next{display:flex;gap:14px;margin-top:22px;align-items:flex-end}
.next div{width:38px;height:57px;border-radius:2px;opacity:.92}
.tabs{position:absolute;left:32px;right:32px;bottom:36px;display:flex;gap:28px;font:400 12px var(--mono);color:var(--faint)}
.tabs .on{color:var(--ink)}
